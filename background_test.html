<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invest.IA Background</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: 0x#F3F4F6; /* fallback background color */
    }
    #vanta-bg {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>

  <!-- Load required scripts -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

  <script>
  VANTA.NET({
    el: "#vanta-bg",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00,
    color: 0x00c46f,        // green lines
    backgroundColor: 0xF3F4F6, // purple background
    points: 11.00,
    maxDistance: 18.00,
    spacing: 13.00
  })
  </script>
</body>
</html>
